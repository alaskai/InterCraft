[package]
name = "intercraft"
version.workspace = true
edition.workspace = true

[dependencies]
intercraft-core = { path = "../core" }
intercraft-geo = { path = "../geo" }
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui_dock = "0.21"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
intercraft-tools = { path = "../tools" }
intercraft-llm = { path = "../llm" }
keyring = "4.2"
# Default features load images from file paths; a model reply must not be able to do that.
egui_commonmark = { version = "=0.25.0", default-features = false, features = ["pulldown_cmark"] }
dirs = "7"
rfd = "0.18"
serde.workspace = true
serde_json.workspace = true
