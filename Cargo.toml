[workspace]
resolver = "2"
members = ["crates/core", "crates/geo", "crates/tools", "crates/llm", "crates/app", "crates/mcp"]
# Plain `cargo run` starts the viewer. Use `--workspace` to build or test everything.
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
